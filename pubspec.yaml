name: disabilitymne
description: "A new Flutter project."

publish_to: 'none' 

version: 1.1.4+27

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  app_pigeon: ^0.1.4
  get: ^4.7.2
  image_picker: ^1.2.0
  dartz: ^0.10.1
  syncfusion_flutter_gauges: ^34.1.29
  sleek_circular_slider: ^2.0.1
  video_player: ^2.8.2
  chewie: ^1.7.5
  percent_indicator: ^4.2.3
  socket_io_client: ^3.1.4
  webview_flutter: ^4.10.0
  in_app_purchase: ^3.2.3
  in_app_purchase_storekit: ^0.4.10
  get_storage: ^2.1.1
  flutter_html: ^3.0.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/AppLogo.png"
  image_path_ios: "assets/logo/AppLogo.png"
  adaptive_icon_background: "#031486"
  adaptive_icon_foreground: "assets/logo/AppLogo.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/logo/
    - assets/icon/
    - assets/image/profile_icons/
    - assets/sounds/